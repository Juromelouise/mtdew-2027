<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dew Squadron — 2P Co-op</title>
<link rel="icon" href="assets/logo_mtdew.png">
<style>
  @font-face { font-family: "Press Start 2P"; src: url(assets/fonts/press-start-2p.woff2) format("woff2"); }
  @font-face { font-family: "Black Ops One"; src: url(assets/fonts/black-ops-one.woff2) format("woff2"); }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; object-fit: contain; }
</style>
</head>
<body>
<canvas id="game" width="1920" height="1080"></canvas>
<script>
'use strict';
// ================= setup =================
const W = 1920, H = 1080, HUD_H = 120, COL = 64;
const cv = document.getElementById('game'), ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;                 // pixel art stays crisp; photos go through smoothImg()

// ---- tuning ----
const MAX_HP = 100, BOTTLE_HP = 30, TEAM_LIVES = 3;       // ONE dew tank and ONE stock of lives, shared by both ships
const BOTTLE_EVERY = [24, 32], CARRIER_DROP = 0.6;        // seconds between free bottles; chance a carrier drops one
const SHIP_SPEED = 600, HIT_IFRAMES = 0.8;
const ENEMY_SHOT_DMG = 6, RAM_DMG = 10, TERRAIN_DMG = 6, LASER_DPS = 30;
const SPECIALS = {                 // the D / E / W buttons (cd = cooldown seconds, dur = active seconds)
  D: { name: 'LASER', color: '#88ff00', cd: 9, dur: 1.6 },
  E: { name: 'GUN', color: '#00ff44', cd: 7, dur: 3 },
  W: { name: 'HOMING', color: '#ccff00', cd: 6, dur: 0 },
};
// Scrolling sections alternate horizontal / vertical. len = seconds of cave terrain; drain = dew lost per second.
const SECTIONS = [
  { dir: 'H', speed: 170, len: 38, name: 'DEW CAVERNS', hint: 'NEVER RUN DRY', drain: 1.3, min: [HUD_H, 48], span: 300, seed: 3, spawn: 2.6 },
  { dir: 'V', speed: 150, len: 38, name: 'THE SHAFT', hint: 'CLIMB!', drain: 1.6, min: [72, 72], span: 460, seed: 11, spawn: 2.2 },
  { dir: 'H', speed: 170, len: 24, name: 'THE DROUGHT', hint: 'END THE DRY SPELL', drain: 1.9, min: [HUD_H, 48], span: 280, seed: 23, spawn: 2.0, boss: true },
];
SECTIONS.forEach(s => { s.cols = Math.round(s.len * s.speed / COL); });
const SCORE = { drone: 100, carrier: 1000, turret: 250 };
// palette: lime = dew / P1 / the world, red = P2 + danger, violet = The Drought, white = hot cores + text
const C = { lime: '#88ff00', hi: '#d9ff8a', leaf: '#3fae1a', moss: '#17641c', deep: '#082d0e', back: '#041507', red: '#ff3355', violet: '#b14dff', pale: '#e7c8ff', dim: '#8fae86' };

const loadImg = src => Object.assign(new Image(), { src });
const IMG = { bg: loadImg('assets/Background-mtdew.png'), logo: loadImg('assets/logo_mtdew.png'), bottle: loadImg('assets/bottom_bottle.png') };
document.fonts.load('20px "Press Start 2P"'); document.fonts.load('40px "Black Ops One"');

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const pick = a => a[Math.random() * a.length | 0];
const dist2 = (a, b) => (a.x - b.x) ** 2 + (a.y - b.y) ** 2;
const hash = n => { const s = Math.sin(n * 127.1) * 43758.5453; return s - Math.floor(s); };
const easeOut = t => t >= 1 ? 1 : 1 - 2 ** (-10 * Math.max(0, t));
function segHit(ax, ay, bx, by, px, py, r) {      // swept point vs circle, so fast shots can't tunnel
  const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy;
  const k = l2 ? clamp(((px - ax) * dx + (py - ay) * dy) / l2, 0, 1) : 0;
  const ex = ax + dx * k - px, ey = ay + dy * k - py;
  return ex * ex + ey * ey < r * r;
}
function sprite(rows, pal, s) {
  if (rows.some(r => r.length !== rows[0].length)) throw new Error('ragged sprite row');
  const c = document.createElement('canvas');
  c.width = rows[0].length * s; c.height = rows.length * s;
  const g = c.getContext('2d');
  rows.forEach((r, y) => [...r].forEach((ch, x) => { if (pal[ch]) { g.fillStyle = pal[ch]; g.fillRect(x * s, y * s, s, s); } }));
  return c;
}
// Player ship: the real Mtn Dew bottle (IMG.bottle, cap = nose, pointing right) riding pixel wings in the pilot's colour.
// This sprite is only the wings, 24 x 15 cells; the root rows tuck under the bottle so no seam shows. See shipArt().
const WING = ['..tff', '..ffffe', '...fffffe', '...fffffffe'], ROOT = '...ffffffff';
const SHIP = [...WING, ROOT, '', '', '', '', '', ROOT, ...WING.slice().reverse()].map(r => r.padEnd(24, '.'));
const SHIP_PAL = { 1: { f: '#88ff00', e: '#d9ff8a', t: '#fff' }, 2: { f: '#ff3355', e: '#ff9aa9', t: '#fff' } };
const SHIP_LEN = 120;                              // bottle length on screen; the art is 184 x 600, so it is 37px wide
// The whole sprite is the hitbox: [u0, u1, halfWidth] boxes in ship space (u along the nose) = bottle body, neck + cap, wings.
const SHIP_BOXES = [[-60, 14, 18.5], [14, 60, 11], [-50, -5, 37.5]];
function shipHit(p, x, y, r) {
  const c = Math.cos(p.ang), s = Math.sin(p.ang), dx = x - p.x, dy = y - p.y;
  const u = dx * c + dy * s, v = Math.abs(dy * c - dx * s);
  return SHIP_BOXES.some(([u0, u1, hv]) => u > u0 - r && u < u1 + r && v < hv + r);
}
console.assert(shipHit({ x: 0, y: 0, ang: 0 }, 45, 0, 1) && !shipHit({ x: 0, y: 0, ang: 0 }, 45, 20, 1)      // nose hits, beside the neck misses
  && shipHit({ x: 0, y: 0, ang: -Math.PI / 2 }, 30, 20, 1), 'shipHit self-check');                         // wing still hits when the ship points up

const HULL = { g: '#cdbcf5', m: '#4b2a85', h: '#7f5ad1', d: '#2a1650', r: '#ff4df0', o: '#ff9cf7', y: '#ffffff', p: '#b14dff' };
const DRONE = sprite([
  'gg.........gg',
  'ggm.......mgg',
  '.mmm.....mmm.',
  '...hhhhhhh...',
  '...mmrrrmm...',
  '...mmmmmmm...',
  '.mmm.....mmm.',
  'ggm.......mgg',
  'gg.........gg',
], HULL, 5);
const CARRIER = sprite([
  '......ppppp......',
  '....hhhhhhhhh....',
  'ppmmmmmrrrmmmmmpp',
  'mmmmmmrrrrrmmmmmm',
  'mmymmmmrrrmmmmymm',
  '.mm.mmmmmmmmm.mm.',
  '.....mmmmmmm.....',
  '....mm.mmm.mm....',
  '....g...g...g....',
], HULL, 8);
const TURRET = sprite([                            // drawn sitting on a floor
  '...hhhhh...',
  '..hmmmmmh..',
  '.hmmrrrmmh.',
  '.mmmrrrmmm.',
  'gmmmmmmmmmg',
  'ggdddddddgg',
], HULL, 5);
const BOSS = sprite([                              // "The Drought"
  '.......hhhhhhhh.......',
  '.....hhmmmmmmmmhh.....',
  '...hhmmmmmmmmmmmmhh...',
  '..hmmmoommmmmmoommmh..',
  '.hmmmmoommrrmmoommmmh.',
  'gmmmmmmmrrrrrrmmmmmmmg',
  'ggmmmmmrryyyyrrmmmmmgg',
  'gmmdmmmrryyyyrrmmmdmmg',
  'gmmdmmmmrrrrrrmmmmdmmg',
  '.hmmdmmoommmmoommdmmh.',
  '..hmmmmoommmmoommmmh..',
  '...ddmmmmmmmmmmmmdd...',
  '....dd.gg.dd.gg.dd....',
  '.......g......g.......',
], HULL, 13);

// ================= audio (synthesised) =================
let AC = null, NOISE = null;
function unlockAudio() {
  if (!AC) {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    NOISE = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate);
    const d = NOISE.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  if (AC.state === 'suspended') AC.resume();
}
function tone(type, f0, f1, dur, vol, delay = 0) {
  const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t + dur);
}
function noise(dur, vol, freq) {
  const t = AC.currentTime, s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = NOISE; f.type = 'lowpass';
  f.frequency.setValueAtTime(freq, t); f.frequency.exponentialRampToValueAtTime(60, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  s.connect(f).connect(g).connect(AC.destination); s.start(t); s.stop(t + dur);
}
const SFX = {
  shoot: p => tone('square', p.id === 2 ? 820 : 1100, p.id === 2 ? 420 : 560, 0.05, 0.018),
  hit: () => tone('sawtooth', 240, 70, 0.14, 0.12),
  boom: () => noise(0.35, 0.22, 1800),
  ko: () => { noise(1.1, 0.5, 2600); tone('sine', 140, 30, 1, 0.4); },
  laser: () => { tone('sawtooth', 220, 880, 0.3, 0.12); noise(1.5, 0.12, 4000); },
  gun: () => tone('square', 300, 120, 0.25, 0.1),
  missile: () => { noise(0.5, 0.2, 2200); tone('triangle', 300, 900, 0.4, 0.1); },
  drink: () => { tone('sine', 520, 260, 0.12, 0.15); tone('sine', 620, 300, 0.12, 0.15, 0.1); tone('square', 880, 1320, 0.1, 0.05, 0.22); },
  low: () => tone('square', 440, 441, 0.18, 0.08),
  nope: () => tone('square', 160, 150, 0.08, 0.05),
  join: () => tone('square', 880, 1320, 0.1, 0.07),
  warp: () => { tone('sawtooth', 120, 1600, 1.6, 0.12); noise(1.8, 0.15, 5000); },
  alarm: () => [0, 0.5, 1, 1.5].forEach(d => tone('square', 880, 440, 0.35, 0.08, d)),
  win: () => [0, 4, 7, 12].forEach((n, i) => tone('square', 523 * 2 ** (n / 12), 524 * 2 ** (n / 12), 0.22, 0.08, i * 0.13)),
};
const sfx = (name, arg) => { if (AC && AC.state === 'running') SFX[name](arg); };

// ================= input: keyboard + up to 2 gamepads =================
// Remap here for arcade encoders. D/E/W are the specials; ships auto-fire.
const BIND = {
  1: { up: ['KeyW'], down: ['KeyS'], left: ['KeyA'], right: ['KeyD'], D: ['KeyC'], E: ['KeyV'], W: ['KeyB'] },
  2: { up: ['ArrowUp'], down: ['ArrowDown'], left: ['ArrowLeft'], right: ['ArrowRight'], D: ['KeyJ', 'Numpad1'], E: ['KeyK', 'Numpad2'], W: ['KeyL', 'Numpad3'] },
};
const PAD_BTN = { D: [2], E: [0], W: [1, 3] };                       // X, A, B (Y also fires W)
const HINT = { 1: 'WASD + C V B', 2: 'ARROWS + J K L' };
const keys = new Set(), tapped = new Set();                           // tapped: press+release inside one frame
const BOUND = new Set(Object.values(BIND).flatMap(b => Object.values(b).flat()));
addEventListener('keydown', e => {
  unlockAudio();
  if (BOUND.has(e.code)) e.preventDefault();
  keys.add(e.code); tapped.add(e.code);
  if (e.code === 'Enter' && state === 'title') { players.forEach(p => { p.joined = true; }); startGame(); }
  if (e.code === 'KeyP' || e.code === 'Escape') paused = !paused && ['play', 'warp'].includes(state);
});
addEventListener('keyup', e => keys.delete(e.code));
addEventListener('blur', () => keys.clear());
addEventListener('pointerdown', unlockAudio);

function readInput(p) {
  const b = BIND[p.id], k = list => list.some(c => keys.has(c) || tapped.has(c));
  let x = (k(b.right) ? 1 : 0) - (k(b.left) ? 1 : 0), y = (k(b.down) ? 1 : 0) - (k(b.up) ? 1 : 0);
  const btn = { D: k(b.D), E: k(b.E), W: k(b.W) };
  const pad = [...(navigator.getGamepads ? navigator.getGamepads() : [])].filter(Boolean)[p.id - 1];
  if (pad) {
    const bt = i => !!(pad.buttons[i] && pad.buttons[i].pressed), ax = pad.axes[0] || 0, ay = pad.axes[1] || 0;
    x += (Math.abs(ax) > 0.25 ? ax : 0) + (bt(15) ? 1 : 0) - (bt(14) ? 1 : 0);
    y += (Math.abs(ay) > 0.25 ? ay : 0) + (bt(13) ? 1 : 0) - (bt(12) ? 1 : 0);
    for (const s of 'DEW') btn[s] = btn[s] || PAD_BTN[s].some(bt);
  }
  const len = Math.hypot(x, y); if (len > 1) { x /= len; y /= len; }
  const hit = {}; for (const s of 'DEW') hit[s] = btn[s] && !p.prev[s];
  p.prev = btn;
  return { x, y, hit, any: hit.D || hit.E || hit.W };
}

// ================= scroll frame =================
// "a" runs along the scroll direction (0 = back edge, FWD = front edge), "b" across it.
let state = 'title', stateT = 0, clock = 0, paused = false;
let secIdx = 0, sec = SECTIONS[0], secDist = 0, bannerT = 0, bossWarnT = 0, teamLives = TEAM_LIVES, joinT = 0, victory = false;
let teamHp = MAX_HP, hpLag = MAX_HP, hpFlash = 0, downT = 0, lowT = 0;      // the shared dew tank
const isH = () => sec.dir === 'H';
const FWD = () => isH() ? W : H;
const LAT = () => isH() ? H : W;
const secAngle = () => isH() ? 0 : -Math.PI / 2;
const toScreen = (a, b) => isH() ? [a, b] : [b, H - a];
const toScroll = (x, y) => isH() ? [x, y] : [H - y, x];
const colAt = a => Math.floor((secDist + a - FWD()) / COL);
// cave wall thickness for column c on side s (0 = top/left, 1 = bottom/right); pure function, so the cave is fixed in the world
function T(c, s) {
  const amt = clamp(c / 10, 0, 1) * clamp((sec.cols - c) / 10, 0, 1);
  const k = c * 0.33 + s * 57.3 + sec.seed;
  const v = 0.55 + 0.3 * Math.sin(k * 0.71) + 0.15 * Math.sin(k * 2.3 + 1.1);
  return Math.round((sec.min[s] + amt * v * sec.span) / 24) * 24;
}
function corridor(a) { const c = colAt(a); return [T(c, 0), LAT() - T(c, 1)]; }
function inTerrain(x, y) { const [a, b] = toScroll(x, y), c = colAt(a); return b < T(c, 0) || b > LAT() - T(c, 1); }

// ================= entities =================
let shots = [], ebullets = [], enemies = [], bottles = [], parts = [], rings = [], pops = [], boss = null;
let shake = 0, flashFx = null, bgOff = 0, spawnT = 0, carrierT = 0, turretT = 0, bottleT = 0, waveSeq = 0;
const waves = {};
const stars = Array.from({ length: 80 }, () => ({ x: Math.random() * W, y: Math.random() * H, s: Math.random() < 0.7 ? 4 : 8, v: 60 + Math.random() * 240 }));

const players = [1, 2].map(id => ({ id, color: id === 1 ? C.lime : C.red, spr: sprite(SHIP, SHIP_PAL[id], 5), big: sprite(SHIP, SHIP_PAL[id], 10),
  joined: false, prev: {}, cd: { D: 0, E: 0, W: 0 }, act: { D: 0, E: 0 }, score: 0, alive: false }));
function placePlayer(p) { [p.x, p.y] = toScreen(320, LAT() / 2 + (p.id === 1 ? -110 : 110)); }
function resetPlayer(p) {
  Object.assign(p, { alive: p.joined, inv: 2, flash: 0, fireT: 0, shotN: 0, score: 0, cd: { D: 0, E: 0, W: 0 }, act: { D: 0, E: 0 }, ang: secAngle() });
  placePlayer(p);
}

function toTitle() {
  state = 'title'; stateT = 0; secIdx = 0; sec = SECTIONS[0]; secDist = 0; boss = null; joinT = 0;
  players.forEach(p => { p.joined = false; resetPlayer(p); });
  shots = []; ebullets = []; enemies = []; bottles = [];
}
function startGame() {
  secIdx = 0; sec = SECTIONS[0]; teamLives = TEAM_LIVES; boss = null; victory = false;
  teamHp = hpLag = MAX_HP; downT = 0;
  players.forEach(resetPlayer);
  startSection();
}
function startSection() {
  secDist = 0; state = 'play'; stateT = 0; bannerT = 3.2; bossWarnT = 0;
  spawnT = 0.8; carrierT = 14; turretT = 1.5; bottleT = 12;    // counted from when the banner clears
}
function startWarp() {
  enemies.forEach(e => explode(e.x, e.y, 1));
  enemies = []; ebullets = []; shots = []; bottles = [];
  secIdx++; sec = SECTIONS[secIdx]; secDist = 0;
  state = 'warp'; stateT = 0; flashFx = { c: '#fff', a: 0.5 }; sfx('warp');
}
function endGame(won) { state = won ? 'clear' : 'over'; stateT = 0; victory = won; }

// ---- player combat ----
function shot(p, x, y, vx, vy, kind, dmg) { shots.push({ owner: p, x, y, vx, vy, kind, dmg, life: kind === 'missile' ? 3 : 1.6 }); }
function autoFire(p) {
  const dx = Math.cos(p.ang), dy = Math.sin(p.ang), mx = p.x + dx * 52, my = p.y + dy * 52;
  if (p.act.E > 0) {                                           // E: gatling spread while active
    for (const a of [-0.16, -0.08, 0, 0.08, 0.16]) shot(p, mx, my, Math.cos(p.ang + a) * 1500, Math.sin(p.ang + a) * 1500, 'gun', 1);
    p.fireT = 0.05;
  } else {
    shot(p, mx - dy * 12, my + dx * 12, dx * 1400, dy * 1400, 'pellet', 1);
    shot(p, mx + dy * 12, my - dx * 12, dx * 1400, dy * 1400, 'pellet', 1);
    p.fireT = 0.12;
  }
  if (p.shotN++ % 3 === 0) sfx('shoot', p);
}
function useSpecial(p, k) {
  if (p.cd[k] > 0) { sfx('nope'); return; }
  const S = SPECIALS[k];
  p.cd[k] = S.cd; if (S.dur) p.act[k] = S.dur;
  if (k === 'W') for (let i = 0; i < 8; i++) { const a = p.ang + (i - 3.5) * 0.32; shot(p, p.x, p.y, Math.cos(a) * 380, Math.sin(a) * 380, 'missile', 4); }
  sfx(k === 'D' ? 'laser' : k === 'E' ? 'gun' : 'missile');
  pop(p.x, p.y - 80, `${S.name}!`, S.color, 24);
}
function hurt(p, dmg) {                              // any hit on either ship comes out of the shared tank
  if (!p.alive || p.inv > 0 || downT > 0 || state !== 'play') return false;
  teamHp -= dmg; p.inv = HIT_IFRAMES; p.flash = 0.1; shake = Math.max(shake, 7); sfx('hit');
  if (teamHp <= 0) teamDown('SHOT DOWN!');
  return true;
}
function teamDown(why) {                             // tank empty: both ships go down and the team spends one shared life
  teamHp = 0; ebullets = [];
  for (const p of players) if (p.alive) { p.alive = false; explode(p.x, p.y, 3, p.color); pop(p.x, p.y - 70, why, p.color, 28); }
  shake = 26; sfx('ko');
  if (teamLives > 0) { teamLives--; downT = 1.8; } else endGame(false);
}
function respawn(p) {
  p.alive = true; p.inv = 2.5; p.ang = secAngle(); placePlayer(p);
  pop(p.x, p.y - 80, 'BACK IN!', p.color, 24);
}
function grabBottle(p) {
  teamHp = Math.min(MAX_HP, teamHp + BOTTLE_HP); hpFlash = 0.18; p.score += 50; sfx('drink');
  pop(p.x, p.y - 80, `+${BOTTLE_HP} DEW`, C.lime, 26);
  burst(p.x, p.y, 12, [C.lime, C.hi, '#fff'], 220, 8, 0.5);
}

// ---- enemies ----
const mk = (kind, o) => Object.assign({ kind, t: 0, flash: 0, x: -999, y: -999, ph: 0, amp: 0 }, o);
function spawnWave() {
  const id = ++waveSeq, n = 4 + (Math.random() * 3 | 0), [lo, hi] = corridor(FWD());
  const amp = Math.max(0, Math.min(pick([0, 60, 110]), (hi - lo) / 2 - 90));
  const b = lo + amp + 70 + Math.random() * Math.max(0, hi - lo - 2 * amp - 140), va = -(260 + Math.random() * 120);
  waves[id] = { size: n, killed: 0 };
  for (let i = 0; i < n; i++) enemies.push(mk('drone', { wave: id, a: FWD() + 60 + i * 85, b, amp, va, ph: i * 0.5, hp: 3, r: 28, fireT: 1.2 + Math.random() * 2.5 }));
}
function spawnCarrier() {
  const [lo, hi] = corridor(FWD());
  enemies.push(mk('carrier', { a: FWD() + 120, b: (lo + hi) / 2, amp: Math.max(0, Math.min(70, (hi - lo) / 2 - 90)), va: -110, hp: 40, maxHp: 40, r: 60, fireT: 1.5, tgt: 0 }));
}
function spawnTurret() {
  const c = colAt(FWD() + COL), side = Math.random() < 0.5 ? 0 : 1;
  if (T(c, side) >= sec.min[side] + 60) enemies.push(mk('turret', { c, side, a: FWD(), hp: 5, r: 30, fireT: 1 + Math.random() * 2 }));
}
function spawnBottle() {
  const [lo, hi] = corridor(FWD());
  const [x, y] = toScreen(FWD() + 50, lo + 90 + Math.random() * Math.max(0, hi - lo - 180));
  dropBottle(x, y);
}
function dropBottle(x, y) {           // drifts at world speed, so it stays put relative to the cave walls
  const [vx, vy] = isH() ? [-sec.speed, 0] : [0, sec.speed];
  bottles.push({ x, y, vx, vy, t: Math.random() * 6 });
}
function spawnBoss() {
  const n = players.filter(p => p.joined).length;
  boss = { a: FWD() + 220, t: 0, hp: 500 + 400 * (n - 1), maxHp: 500 + 400 * (n - 1), r: 110, flash: 0, fireT: 2, ringT: 3.5, droneT: 5, dying: 0, x: -999, y: -999 };
}
function aimShot(e, p, da, sp) { const a = Math.atan2(p.y - e.y, p.x - e.x) + da; ebullets.push({ x: e.x, y: e.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp }); }
function nearestOf(e, list) { let best = null, bd = Infinity; for (const q of list) { const d = dist2(e, q); if (d < bd) { bd = d; best = q; } } return best; }
function enemyFire(e) {
  const targets = players.filter(p => p.alive); if (!targets.length) return;
  if (e.kind === 'carrier') { const p = targets[e.tgt++ % targets.length]; for (let i = -2; i <= 2; i++) aimShot(e, p, i * 0.16, 300); e.fireT = 1.4; }
  else if (e.kind === 'turret') { aimShot(e, nearestOf(e, targets), 0, 330); e.fireT = 2 + Math.random() * 1.2; }
  else { aimShot(e, pick(targets), 0, 340); e.fireT = 2 + Math.random() * 2.4; }
}
function damageEnemy(e, dmg, by) {
  if (e.dead) return;
  e.hp -= dmg; e.flash = 0.06;
  if (e.hp > 0) return;
  e.dead = true; explode(e.x, e.y, e.kind === 'carrier' ? 2.5 : 1); sfx('boom');
  by.score += SCORE[e.kind];
  if (e.kind !== 'drone') pop(e.x, e.y - 40, `+${SCORE[e.kind]}`, by.color, 20);
  if (e.kind === 'carrier' && Math.random() < CARRIER_DROP) dropBottle(e.x, e.y);     // bottles are rare: only the big ones carry them
  const w = waves[e.wave];
  if (w && ++w.killed === w.size) { by.score += 500; pop(e.x, e.y - 40, 'WAVE +500', by.color, 20); }
}
function damageBoss(dmg, by) {
  if (!boss || boss.dying) return;
  dmg = Math.min(dmg, boss.hp);
  boss.hp -= dmg; boss.flash = 0.05; by.score += dmg * 10;
  if (boss.hp > 0) return;
  boss.hp = 0; boss.dying = 2.4; by.score += 10000; ebullets = [];
  pop(boss.x, boss.y - 150, 'THE DROUGHT IS DOWN!', '#fff', 30);
}

// ---- fx ----
function burst(x, y, n, colors, sp, size, life) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = sp * (0.3 + Math.random());
    parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: life * (0.5 + Math.random()), c: pick(colors), s: size * (0.5 + Math.random()) });
  }
}
function explode(x, y, big, c = C.violet) {
  burst(x, y, 14 * big, ['#fff', '#fff', c, c === C.violet ? C.pale : C.hi], 260 * Math.sqrt(big), 8 + 2 * big, 0.7);
  rings.push({ x, y, r: 10, vr: 380 * big, w: 6 * big, life: 1, c: '#fff' });
}
const spark = (x, y, c) => burst(x, y, 4, [c, '#fff'], 180, 5, 0.25);
const pop = (x, y, s, c, size) => pops.push({ x, y, s, c, size, life: 1.3 });

// ================= update =================
function update(dt) {
  clock += dt; stateT += dt;
  shake = Math.max(0, shake - 60 * dt);
  if (flashFx) flashFx.a -= dt * 1.6;
  const warp = state === 'warp', speed = (warp ? 6 : 1) * sec.speed;
  bgOff += speed * 0.35 * dt;
  for (const s of stars) {
    if (isH()) { s.x -= s.v * dt * (speed / 170); if (s.x < -20) { s.x = W + 10; s.y = Math.random() * H; } }
    else { s.y += s.v * dt * (speed / 150); if (s.y > H + 20) { s.y = -10; s.x = Math.random() * W; } }
  }
  const inp = players.map(readInput);

  if (state === 'title') {
    players.forEach((p, i) => { if (inp[i].any && !p.joined) { p.joined = true; resetPlayer(p); sfx('join'); if (!joinT) joinT = clock; } });
    if (players.every(p => p.joined) ? clock - joinT > 0.8 : joinT && clock - joinT > 6) startGame();
  } else if (state === 'play') {
    secDist += sec.speed * dt; bannerT -= dt;
    const end = sec.cols * COL;
    if (bannerT <= 0 && !boss && bossWarnT <= 0 && secDist < end + FWD() * 0.55) {
      if ((spawnT -= dt) <= 0) { spawnWave(); spawnT = sec.spawn * (0.8 + Math.random() * 0.5); }
      if ((carrierT -= dt) <= 0) { spawnCarrier(); carrierT = 14 + Math.random() * 6; }
      if ((turretT -= dt) <= 0) { spawnTurret(); turretT = 1.6 + Math.random() * 1.6; }
    }
    if (bannerT <= 0 && (bottleT -= dt) <= 0) { spawnBottle(); bottleT = BOTTLE_EVERY[0] + Math.random() * (BOTTLE_EVERY[1] - BOTTLE_EVERY[0]); }
    if (sec.boss) {
      if (!boss && bossWarnT <= 0 && secDist > end + FWD() * 0.55) { bossWarnT = 3; sfx('alarm'); }
      else if (bossWarnT > 0 && (bossWarnT -= dt) <= 0) spawnBoss();
    } else if (secDist > end + FWD()) startWarp();
    if (downT > 0) {                                          // both ships down: wait, then refill from a spare life
      if ((downT -= dt) <= 0) { teamHp = MAX_HP; players.forEach(p => { if (p.joined) respawn(p); }); }
    } else {
      teamHp -= sec.drain * dt;                               // the dew drains nonstop
      if (teamHp > 25) lowT = 0;
      else if ((lowT -= dt) <= 0) { lowT = 1.2; sfx('low'); for (const p of players) if (p.alive) pop(p.x, p.y - 80, 'LOW DEW!', C.red, 22); }
      if (teamHp <= 0) teamDown('RAN DRY!');
    }
  } else if (state === 'warp') {
    if (stateT > 2.4) startSection();
  } else if (state === 'clear') {
    if (Math.random() < 0.7) burst(Math.random() * W, -10, 3, [C.lime, C.lime, C.red, '#fff'], 120, 12, 2.5);
    if (stateT > 4) { state = 'results'; stateT = 0; }
  } else if (state === 'over') {
    if (stateT > 3) { state = 'results'; stateT = 0; }
  } else if (state === 'results') {
    if (stateT > 3 && inp.some(i => i.any)) toTitle();
  }

  hpLag = Math.max(teamHp, hpLag - 30 * dt); hpFlash -= dt;

  // ---- players ----
  players.forEach((p, i) => {
    const c = inp[i];
    p.inv -= dt; p.flash -= dt; p.fireT -= dt; p.act.D -= dt; p.act.E -= dt;
    for (const k of 'DEW') p.cd[k] = Math.max(0, p.cd[k] - dt);
    if (!p.joined || state === 'results') return;
    if (!p.alive) return;
    if (warp) {                                               // glide into the new orientation
      const [tx, ty] = toScreen(320, LAT() / 2 + (p.id === 1 ? -110 : 110));
      p.x += (tx - p.x) * Math.min(1, dt * 3); p.y += (ty - p.y) * Math.min(1, dt * 3);
    } else {
      p.x = clamp(p.x + c.x * SHIP_SPEED * dt, 64, W - 64);
      p.y = clamp(p.y + c.y * SHIP_SPEED * dt, HUD_H + 40, H - 40);
    }
    let da = secAngle() - p.ang; da = Math.atan2(Math.sin(da), Math.cos(da)); p.ang += da * Math.min(1, dt * 5);
    if (state === 'play') {
      // cave walls vs the whole hull (the ship flies nose-first along the scroll axis): push out + damage
      const [a, b] = toScroll(p.x, p.y);
      let lo = -Infinity, hi = Infinity;
      for (const [u0, u1, hv] of SHIP_BOXES) for (const u of [u0, (u0 + u1) / 2, u1]) {
        const cc = colAt(a + u); lo = Math.max(lo, T(cc, 0) + hv); hi = Math.min(hi, LAT() - T(cc, 1) - hv);
      }
      const nb = lo > hi ? (lo + hi) / 2 : clamp(b, lo, hi);
      if (nb !== b) { [p.x, p.y] = toScreen(a, nb); if (hurt(p, TERRAIN_DMG)) spark(p.x, p.y, C.lime); }
      if (p.fireT <= 0) autoFire(p);
      for (const k of 'DEW') if (c.hit[k]) useSpecial(p, k);
    }
    parts.push({ x: p.x - Math.cos(p.ang) * 70, y: p.y - Math.sin(p.ang) * 70, vx: -Math.cos(p.ang) * 200, vy: -Math.sin(p.ang) * 200, life: 0.25, c: p.color, s: 8 });
  });

  // ---- D: laser beams ----
  for (const p of players) {
    if (!p.alive || p.act.D <= 0 || state !== 'play') continue;
    const dx = Math.cos(p.ang), dy = Math.sin(p.ang), ox = p.x + dx * 52, oy = p.y + dy * 52;
    const inBeam = (x, y, r) => (x - ox) * dx + (y - oy) * dy > -r && Math.abs((x - ox) * dy - (y - oy) * dx) < r + 26;
    for (const e of enemies) if (!e.dead && inBeam(e.x, e.y, e.r)) { damageEnemy(e, LASER_DPS * dt, p); if (Math.random() < 0.3) spark(e.x, e.y, p.color); }
    if (boss && inBeam(boss.x, boss.y, boss.r)) damageBoss(LASER_DPS * dt, p);
    ebullets = ebullets.filter(b => !inBeam(b.x, b.y, 8));
  }

  // ---- player shots ----
  for (const s of shots) {
    if (s.kind === 'missile') {
      const cands = enemies.filter(e => !e.dead && e.x > -50 && e.x < W + 50 && e.y > 0 && e.y < H);
      if (boss && !boss.dying) cands.push(boss);
      const tgt = nearestOf(s, cands);
      let ang = Math.atan2(s.vy, s.vx);
      const sp = Math.min(1100, Math.hypot(s.vx, s.vy) + 1400 * dt);
      if (tgt) { const d = Math.atan2(tgt.y - s.y, tgt.x - s.x) - ang; ang += clamp(Math.atan2(Math.sin(d), Math.cos(d)), -5 * dt, 5 * dt); }
      s.vx = Math.cos(ang) * sp; s.vy = Math.sin(ang) * sp;
      if (Math.random() < 0.5) parts.push({ x: s.x, y: s.y, vx: 0, vy: 0, life: 0.3, c: C.hi, s: 6 });
    }
    const ox = s.x, oy = s.y;
    s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt;
    if (state === 'play' && inTerrain(s.x, s.y)) { s.life = 0; spark(s.x, s.y, s.owner.color); continue; }
    for (const e of enemies) {
      if (e.dead || !segHit(ox, oy, s.x, s.y, e.x, e.y, e.r)) continue;
      damageEnemy(e, s.dmg, s.owner); spark(s.x, s.y, s.owner.color); s.life = 0; break;
    }
    if (s.life > 0 && boss && !boss.dying && segHit(ox, oy, s.x, s.y, boss.x, boss.y, boss.r)) { damageBoss(s.dmg, s.owner); spark(s.x, s.y, s.owner.color); s.life = 0; }
  }
  shots = shots.filter(s => s.life > 0 && s.x > -60 && s.x < W + 60 && s.y > -60 && s.y < H + 60);

  // ---- enemies ----
  for (const e of enemies) {
    e.t += dt; e.flash -= dt;
    if (e.kind === 'turret') {
      e.a = (e.c + 0.5) * COL - secDist + FWD();
      [e.x, e.y] = toScreen(e.a, e.side ? LAT() - T(e.c, 1) : T(e.c, 0));
    } else {
      e.a += e.va * dt;
      [e.x, e.y] = toScreen(e.a, e.b + Math.sin(e.t * (e.kind === 'carrier' ? 0.8 : 2.4) + e.ph) * e.amp);
    }
    if (e.a < -150) { e.dead = true; continue; }               // escaped, no credit
    if (state === 'play' && e.a > 40 && e.a < FWD() - 40 && e.y > HUD_H && (e.fireT -= dt) <= 0) enemyFire(e);
    if (e.kind !== 'turret') for (const p of players) if (!e.dead && p.alive && shipHit(p, e.x, e.y, e.r * 0.8) && hurt(p, RAM_DMG)) damageEnemy(e, 999, p);
  }
  enemies = enemies.filter(e => !e.dead);

  // ---- boss ----
  if (boss) {
    const b = boss;
    b.t += dt; b.flash -= dt;
    b.a += (FWD() - 300 - b.a) * Math.min(1, dt * 0.8);
    [b.x, b.y] = toScreen(b.a, LAT() / 2 + 40 + Math.sin(b.t * 0.7) * 230);
    if (b.dying > 0) {
      b.dying -= dt; shake = 12;
      if (Math.random() < 0.4) explode(b.x + (Math.random() - 0.5) * 260, b.y + (Math.random() - 0.5) * 160, 1.5);
      if (b.dying <= 0) { explode(b.x, b.y, 6); flashFx = { c: '#fff', a: 0.9 }; boss = null; if (state === 'play') { sfx('win'); endGame(true); } }
    } else if (state === 'play') {
      const targets = players.filter(p => p.alive), p2 = b.hp < b.maxHp / 2;
      if (targets.length) {
        if ((b.fireT -= dt) <= 0) { const p = pick(targets); for (let i = -2; i <= 2; i++) aimShot(b, p, i * 0.14, 380); b.fireT = p2 ? 0.9 : 1.5; }
        if ((b.ringT -= dt) <= 0) {
          const n = p2 ? 22 : 16;
          for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2 + b.t; ebullets.push({ x: b.x, y: b.y, vx: Math.cos(a) * 250, vy: Math.sin(a) * 250 }); }
          b.ringT = p2 ? 2.4 : 3.6;
        }
        if (p2 && (b.droneT -= dt) <= 0) { spawnWave(); b.droneT = 6; }
      }
      for (const p of players) if (p.alive && shipHit(p, b.x, b.y, b.r * 0.8)) hurt(p, RAM_DMG);
    }
  }

  // ---- enemy bullets ----
  for (const b of ebullets) {
    b.x += b.vx * dt; b.y += b.vy * dt;
    if (state === 'play' && inTerrain(b.x, b.y)) { b.dead = true; continue; }
    for (const p of players) if (!b.dead && p.alive && shipHit(p, b.x, b.y, 7) && hurt(p, ENEMY_SHOT_DMG)) { b.dead = true; spark(b.x, b.y, C.violet); }
  }
  ebullets = ebullets.filter(b => !b.dead && b.x > -30 && b.x < W + 30 && b.y > -30 && b.y < H + 30);

  // ---- bottles ----
  for (const bt of bottles) {
    bt.t += dt; bt.x += bt.vx * dt; bt.y += bt.vy * dt;
    for (const p of players) if (!bt.got && p.alive && shipHit(p, bt.x, bt.y, 40)) { bt.got = true; grabBottle(p); }
  }
  bottles = bottles.filter(bt => !bt.got && bt.x > -80 && bt.y < H + 80);

  // ---- fx ----
  for (const q of parts) { q.x += q.vx * dt; q.y += q.vy * dt; q.vx *= 1 - 2.5 * dt; q.vy *= 1 - 2.5 * dt; q.life -= dt; }
  parts = parts.filter(q => q.life > 0);
  for (const r of rings) { r.r += r.vr * dt; r.life -= dt * 2.2; }
  rings = rings.filter(r => r.life > 0);
  for (const q of pops) { q.y -= 50 * dt; q.life -= dt; }
  pops = pops.filter(q => q.life > 0);
}

// ================= drawing =================
// Look: the flat pixel world of the DO THE DEW artwork. Lime blocks on black, white offset outlines, no glows.
function txt(s, x, y, { size = 24, font = 'P', color = '#fff', align = 'center', shadow = false } = {}) {
  ctx.font = `${size}px ${font === 'P' ? '"Press Start 2P"' : '"Black Ops One"'}`;
  ctx.textAlign = align; ctx.textBaseline = 'middle';
  if (shadow) { ctx.fillStyle = '#000'; ctx.fillText(s, x + 3, y + 3); }
  ctx.fillStyle = color; ctx.fillText(s, x, y);
}
function block(s, x, y, size, color) {             // display type: flat fill + white offset outline, as in the DO THE DEW lockup
  const o = Math.round(size * 0.08);
  ctx.font = `${size}px "Press Start 2P"`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineWidth = Math.max(3, size * 0.04); ctx.lineJoin = 'miter'; ctx.strokeStyle = '#fff';
  ctx.strokeText(s, x + o, y + o);
  ctx.fillStyle = color; ctx.fillText(s, x, y);
}
function sparkle(x, y, r) {                        // the four-point star used as a bullet mark in the brand artwork
  for (const [k, c] of [[1, '#fff'], [0.5, C.lime]]) {
    ctx.beginPath();
    for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4, q = (i % 2 ? 0.28 : 1) * r * k; ctx.lineTo(x + Math.cos(a) * q, y + Math.sin(a) * q); }
    ctx.closePath(); ctx.fillStyle = c; ctx.fill();
  }
}
function confetti() {                              // the lime pixel squares that edge every DO THE DEW screen
  const cell = 24, dens = [0.55, 0.34, 0.16];
  ctx.fillStyle = C.lime;
  for (let r = 0; r < 3; r++) for (let i = 0; i < W / cell; i++) for (const top of [0, 1]) {
    const roll = Math.floor(clock * 0.35 + hash(i * 3.1 + r * 17 + top * 5) * 9);       // each cell re-rolls now and then
    if (hash(i * 7.3 + r * 31.7 + top * 91 + roll * 0.37) < dens[r]) ctx.fillRect(i * cell, top ? r * cell : H - (r + 1) * cell, cell, cell);
  }
}
function keycap(cx, cy, s, ch, col, fg) {
  const r = s * 0.18;
  ctx.fillStyle = '#04250a'; ctx.beginPath(); ctx.roundRect(cx - s / 2, cy - s / 2 + s * 0.14, s, s, r); ctx.fill();
  const g = ctx.createLinearGradient(0, cy - s / 2, 0, cy + s / 2);
  g.addColorStop(0, '#ffffff'); g.addColorStop(0.3, col); g.addColorStop(1, col);
  ctx.fillStyle = g; ctx.beginPath(); ctx.roundRect(cx - s / 2, cy - s / 2, s, s, r); ctx.fill();
  ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.stroke();
  txt(ch, cx + 1, cy + 2, { size: s * 0.46 | 0, color: fg });
}
function smoothImg(im, x, y, w, h) { ctx.imageSmoothingEnabled = true; ctx.drawImage(im, x, y, w, h); ctx.imageSmoothingEnabled = false; }
function drawSprite(im, x, y, flash) {
  ctx.drawImage(im, x - im.width / 2, y - im.height / 2);
  if (flash > 0) { ctx.globalCompositeOperation = 'lighter'; ctx.drawImage(im, x - im.width / 2, y - im.height / 2); ctx.globalCompositeOperation = 'source-over'; }
}
function bottleImg(x, y, h, rot = 0) {
  const im = IMG.bottle; if (!im.naturalWidth) return;
  const w = h * im.naturalWidth / im.naturalHeight;
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); smoothImg(im, -w / 2, -h / 2, w, h); ctx.restore();
}
function diamond(x, y, r, rot, col, lw) {          // spinning square outline behind every bottle
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.strokeRect(-r, -r, r * 2, r * 2); ctx.restore();
}
// fill a rect given in scroll space (a along, b across)
function fillS(col, a, b, da, db) { ctx.fillStyle = col; if (isH()) ctx.fillRect(a, b, da, db); else ctx.fillRect(b, H - a - da, db, da); }

function drawBackground() {
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  const im = IMG.bg;
  if (im.naturalWidth) {                         // mirror-tiled along the scroll axis, so it's seamless
    ctx.globalAlpha = 0.4;
    if (isH()) {
      const tw = im.naturalWidth * H / im.naturalHeight, o = bgOff % (2 * tw);
      for (let k = 0, x = -o; x < W; k++, x += tw) {
        if (k % 2) { ctx.save(); ctx.translate(x + tw, 0); ctx.scale(-1, 1); smoothImg(im, 0, 0, tw, H); ctx.restore(); }
        else smoothImg(im, x, 0, tw, H);
      }
    } else {                                     // rotated 90° so its bands become the shaft walls
      const th = im.naturalWidth * W / im.naturalHeight, o = bgOff % (2 * th);
      for (let k = 0, y = o - 2 * th; y < H; k++, y += th) {
        ctx.save(); ctx.translate(W / 2, y + th / 2); ctx.rotate(Math.PI / 2); if (k % 2) ctx.scale(-1, 1);
        smoothImg(im, -th / 2, -W / 2, th, W); ctx.restore();
      }
    }
    ctx.globalAlpha = 1;
  }
  const streak = state === 'warp';
  for (const s of stars) {
    ctx.fillStyle = `rgba(136,255,0,${0.15 + s.v / 900})`;
    if (!streak) ctx.fillRect(s.x, s.y, s.s, s.s);
    else if (isH()) ctx.fillRect(s.x, s.y, s.v * 0.6, 4); else ctx.fillRect(s.x, s.y - s.v * 0.6, 4, s.v * 0.6);
  }
}

const EDGE = [[C.moss, 24, 12], [C.leaf, 12, 6], [C.lime, 6, 0]];      // [colour, depth it starts at, depth it ends at] from the rock face inward
function drawTerrain() {
  const F = FWD(), L = LAT();
  const BW = 128, off = secDist * 0.5;           // far wall: dark, half speed, no lime edge = not solid. Fades out before the open arenas.
  for (let c = Math.floor(off / BW); c * BW - off < F; c++) for (const s of [0, 1]) {
    const w = c * BW, env = clamp((w - F) / 600, 0, 1) * clamp(((sec.cols * COL + F * 0.5) * 0.5 - w) / 600, 0, 1);
    const t = sec.min[s] + Math.round(sec.span * env * (0.5 + 0.4 * Math.sin(c * 1.3 + s * 2.1 + sec.seed)) / 48) * 48;
    fillS(C.back, w - off, s ? L - t : 0, BW, t);
  }
  for (let c = colAt(0); c <= colAt(F) + 1; c++) {
    const a0 = c * COL - secDist + F;
    for (const s of [0, 1]) {
      const t = T(c, s), band = (col, a, da, t0, t1) => fillS(col, a, s ? L - t1 : t0, da, t1 - t0);   // t0..t1 = depth into the rock
      band(C.deep, a0, COL, 0, t);
      for (let j = 0; j < 4; j++) {              // rock grain
        const h1 = hash(c * 13 + j * 7 + s * 101);
        if (h1 > 0.4 && t > 96) { const d = 12 + Math.floor(hash(h1 * 99) * (t - 60) / 12) * 12; band(h1 > 0.93 ? C.leaf : C.moss, a0 + 4 + j * 16, 12, d, d + 12); }
      }
      for (const [col, wd, inset] of EDGE) band(col, a0, COL, t - wd, t - inset);
      for (const [tp, edge, dir] of [[T(c - 1, s), a0, 1], [T(c + 1, s), a0 + COL, -1]]) if (tp < t)   // step faces carry the same edge light
        for (const [col, wd, inset] of EDGE) band(col, dir > 0 ? edge : edge - wd, wd, tp - wd, t - inset);
    }
  }
}

function drawTurret(e) {
  const [nx, ny] = isH() ? [0, e.side ? -1 : 1] : [e.side ? -1 : 1, 0];
  const tgt = nearestOf(e, players.filter(p => p.alive)), aim = tgt ? Math.atan2(tgt.y - e.y, tgt.x - e.x) : Math.atan2(ny, nx);
  ctx.save(); ctx.translate(e.x + nx * 14, e.y + ny * 14); ctx.rotate(aim);
  ctx.fillStyle = HULL.g; ctx.fillRect(0, -6, 46, 12); ctx.fillStyle = HULL.h; ctx.fillRect(36, -8, 10, 16);
  ctx.restore();
  ctx.save(); ctx.translate(e.x, e.y); ctx.rotate(Math.atan2(nx, -ny));     // stand the dome on its wall
  drawSprite(TURRET, 0, 5 - TURRET.height / 2, e.flash);
  ctx.restore();
}

function flame(x, y, len, k, col) {               // stepped exhaust that tapers away from the tail at (x, y); k = pixel scale
  ctx.fillStyle = col; ctx.fillRect(x - len * 0.5, y - 8 * k, len * 0.5, 16 * k); ctx.fillRect(x - len, y - 3 * k, len * 0.5, 6 * k);
  ctx.fillStyle = '#fff'; ctx.fillRect(x - len * 0.3, y - 4 * k, len * 0.3, 8 * k);
}
function shipArt(p, k, flash) {                    // nose-right at the origin; k = 1 in play, 2 on the player cards
  const bottle = () => bottleImg(0, 0, SHIP_LEN * k, Math.PI / 2);
  drawSprite(k > 1 ? p.big : p.spr, 0, 0, flash);
  ctx.shadowColor = p.color;                       // hard rim in the pilot's colour: the bottle's own outline is black, and so is the cave
  for (const [ox, oy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) { ctx.shadowOffsetX = ox * 3 * k; ctx.shadowOffsetY = oy * 3 * k; bottle(); }
  ctx.shadowColor = 'transparent';
  if (flash > 0) { ctx.globalCompositeOperation = 'lighter'; bottle(); ctx.globalCompositeOperation = 'source-over'; }
}
function drawShip(p) {
  if (!p.joined || !p.alive) return;
  ctx.save(); ctx.translate(p.x, p.y);
  if (p.inv > 0 && (clock * 18 | 0) % 2) ctx.globalAlpha = 0.35;
  ctx.rotate(p.ang);                               // art is drawn nose-right
  flame(-60, 0, 20 + Math.random() * 24, 1, p.color);
  shipArt(p, 1, p.flash);
  ctx.restore();
  const th = p.ang - Math.PI / 2;
  txt(`${p.id}P`, p.x + Math.cos(th) * 64, p.y + Math.sin(th) * 64, { size: 18, color: p.color, shadow: true });
}

function pixelOrb(x, y, r, c) { ctx.fillStyle = c; ctx.fillRect(x - r, y - r / 2, r * 2, r); ctx.fillRect(x - r / 2, y - r, r, r * 2); ctx.fillRect(x - r * 0.75, y - r * 0.75, r * 1.5, r * 1.5); }

function drawScene() {
  if (state !== 'warp') drawTerrain();

  for (const bt of bottles) {
    const y = bt.y + Math.sin(bt.t * 4) * 6;
    ctx.globalAlpha = 0.55 + 0.35 * Math.sin(bt.t * 6); diamond(bt.x, y, 46, bt.t * 1.5, C.lime, 5); ctx.globalAlpha = 1;
    bottleImg(bt.x, y, 92, Math.sin(bt.t * 2) * 0.25);
    sparkle(bt.x + 40, y - 36, 12 + 4 * Math.sin(bt.t * 7)); sparkle(bt.x - 38, y + 32, 8 + 3 * Math.cos(bt.t * 5));
  }
  for (const e of enemies) {
    if (e.kind === 'turret') { drawTurret(e); continue; }
    drawSprite(e.kind === 'carrier' ? CARRIER : DRONE, e.x, e.y, e.flash);
    if (e.kind === 'carrier' && e.hp < e.maxHp) {
      ctx.fillStyle = '#000'; ctx.fillRect(e.x - 62, e.y - 62, 124, 14);
      ctx.fillStyle = C.violet; ctx.fillRect(e.x - 58, e.y - 58, 116 * e.hp / e.maxHp, 6);
    }
  }
  if (boss) drawSprite(BOSS, boss.x, boss.y, boss.flash);
  players.forEach(drawShip);

  for (const p of players) {                     // D laser beams
    if (!p.alive || p.act.D <= 0) continue;
    const bw = 44 + ((clock * 30 | 0) % 2) * 8;
    ctx.save(); ctx.translate(p.x + Math.cos(p.ang) * 52, p.y + Math.sin(p.ang) * 52); ctx.rotate(p.ang);
    ctx.globalAlpha = 0.35; ctx.fillStyle = p.color; ctx.fillRect(0, -bw, 2400, bw * 2);
    ctx.globalAlpha = 1; ctx.fillRect(0, -bw / 2, 2400, bw);
    ctx.fillStyle = '#fff'; ctx.fillRect(0, -bw / 6, 2400, bw / 3); ctx.fillRect(-10, -bw * 0.6, 28, bw * 1.2);
    ctx.restore();
  }
  for (const s of shots) {                       // bolts: a coloured bar with a white tip
    const c = s.kind === 'gun' ? SPECIALS.E.color : s.owner.color, len = s.kind === 'gun' ? 30 : 22;
    ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(Math.atan2(s.vy, s.vx));
    ctx.fillStyle = c; ctx.fillRect(-len / 2, -4, len, 8); ctx.fillStyle = '#fff'; ctx.fillRect(len / 2 - 8, -3, 8, 6);
    ctx.restore();
  }
  for (const q of parts) { ctx.globalAlpha = Math.min(1, q.life * 3); ctx.fillStyle = q.c; ctx.fillRect(q.x - q.s / 2, q.y - q.s / 2, q.s, q.s); }
  for (const r of rings) { ctx.globalAlpha = Math.max(0, r.life); ctx.strokeStyle = r.c; ctx.lineWidth = r.w * r.life + 2; ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2); ctx.stroke(); }
  ctx.globalAlpha = 1;

  const pulse = 1 + ((clock * 8 | 0) % 2) * 0.15;      // enemy bullets on top so they always read
  for (const b of ebullets) {
    pixelOrb(b.x, b.y, 14 * pulse, '#2a0a4a'); pixelOrb(b.x, b.y, 10 * pulse, C.violet);
    ctx.fillStyle = '#fff'; ctx.fillRect(b.x - 4, b.y - 4, 8, 8);
  }
  for (const q of pops) { ctx.globalAlpha = Math.min(1, q.life * 2); txt(q.s, q.x, q.y, { size: q.size, color: q.c, shadow: true }); }
  ctx.globalAlpha = 1;
}

function drawWorld() {
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  drawBackground();
  if (state !== 'title' && state !== 'results') drawScene();
  if (flashFx && flashFx.a > 0) { ctx.globalAlpha = flashFx.a; ctx.fillStyle = flashFx.c; ctx.fillRect(-40, -40, W + 80, H + 80); ctx.globalAlpha = 1; }
  ctx.restore();
}

// ---- HUD: each player's buttons in their own corner, the shared tank between them ----
function abilityCap(p, k, cx, cy) {
  const S = SPECIALS[k], s = 64, cd = p.cd[k];
  if ((p.act[k] || 0) > 0) keycap(cx, cy, s, k, (clock * 12 | 0) % 2 ? '#fff' : S.color, '#062b0c');
  else if (cd <= 0) keycap(cx, cy, s, k, S.color, '#062b0c');
  else {                                          // cooling down: seconds left on a dark cap, refill bar under it
    keycap(cx, cy, s, String(Math.ceil(cd)), '#1d3a22', '#fff');
    ctx.fillStyle = S.color; ctx.fillRect(cx - s / 2, cy + s / 2 + 14, s * (1 - cd / S.cd), 6);
  }
}
function drawPlayerHud(p, right) {
  const x = right ? W - 36 : 36, align = right ? 'right' : 'left', k0 = right ? W - 432 : 264;
  txt(`P${p.id}`, x, 46, { size: 64, font: 'B', color: p.joined ? p.color : '#17341c', align });
  if (!p.joined) return;
  txt(String(Math.floor(p.score)).padStart(7, '0'), x, 98, { size: 22, align });
  [...'DEW'].forEach((k, i) => abilityCap(p, k, k0 + i * 84, 50));
}
function drawTank() {
  const x = 640, y = 20, w = 640, h = 44, f = clamp(teamHp / MAX_HP, 0, 1);
  const low = f < 0.25 && state === 'play', blink = (clock * 6 | 0) % 2, main = hpFlash > 0 ? '#fff' : low ? C.red : C.lime;
  txt('DEW', x - 22, y + h / 2 + 2, { size: 26, color: low && blink ? '#fff' : main, align: 'right' });
  ctx.fillStyle = low ? (blink ? '#fff' : C.red) : C.moss; ctx.fillRect(x - 6, y - 6, w + 12, h + 12);
  ctx.fillStyle = C.back; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = '#fff'; ctx.fillRect(x, y, w * clamp(hpLag / MAX_HP, 0, 1), h);          // white chunk = what a hit just cost
  ctx.fillStyle = main; ctx.fillRect(x, y, w * f, h);
  ctx.fillStyle = hpFlash > 0 ? '#fff' : low ? '#ff9aa9' : C.hi; ctx.fillRect(x, y, w * f, 8);
  ctx.fillStyle = C.back; for (let i = 1; i < 20; i++) ctx.fillRect(x + i * w / 20 - 2, y, 4, h);
  bottleImg(x + w + 52, y + h / 2, 64, 0.3);      // shared lives = spare bottles
  txt(`x${teamLives}`, x + w + 80, y + h / 2 + 2, { size: 26, align: 'left' });
  txt('TEAM', W / 2 - 138, 98, { size: 20, color: C.dim, align: 'left' });
  txt(String(Math.floor(players[0].score + players[1].score)).padStart(8, '0'), W / 2 - 38, 98, { size: 22, align: 'left' });
  if (low && blink) { ctx.fillStyle = C.red; ctx.fillRect(0, HUD_H, W, 10); ctx.fillRect(0, H - 10, W, 10); ctx.fillRect(0, HUD_H, 10, H); ctx.fillRect(W - 10, HUD_H, 10, H); }
}
function drawHud() {
  ctx.fillStyle = 'rgba(0,0,0,0.92)'; ctx.fillRect(0, 0, W, HUD_H);
  ctx.fillStyle = C.lime; ctx.fillRect(0, HUD_H - 4, W, 4);
  drawPlayerHud(players[0], false); drawPlayerHud(players[1], true);
  drawTank();
  if (boss) {
    const bw = 900, x = W / 2 - bw / 2, y = HUD_H + 24;
    ctx.fillStyle = '#2a0a4a'; ctx.fillRect(x - 6, y - 6, bw + 12, 32);
    ctx.fillStyle = C.violet; ctx.fillRect(x, y, bw * boss.hp / boss.maxHp, 20);
    ctx.fillStyle = C.pale; ctx.fillRect(x, y, bw * boss.hp / boss.maxHp, 5);
    txt('THE DROUGHT', W / 2, y + 50, { size: 20, color: C.pale, shadow: true });
  }
}

// ---- banners: one lime slab that slams in from the left ----
const para = (x, y, w, h, sk) => { ctx.beginPath(); ctx.moveTo(x + sk, y); ctx.lineTo(x + w + sk, y); ctx.lineTo(x + w, y + h); ctx.lineTo(x, y + h); ctx.closePath(); };
const slideIn = t => -(1 - easeOut(t / 0.45)) * 1900;
function slab(s, bg, sub = '', dx = 0, plate = '') {
  const size = Math.min(88, 1400 / s.length), pw = plate ? 150 : 0, w = s.length * size + pw + 150, h = 170, sk = 60;
  const x = W / 2 - (w + sk) / 2 + dx, y = H / 2 - h / 2 - 20;
  para(x + 12, y + 12, w, h, sk); ctx.strokeStyle = '#fff'; ctx.lineWidth = 4; ctx.stroke();
  para(x, y, w, h, sk); ctx.fillStyle = bg; ctx.fill();
  if (plate) {                                    // stage number, punched out of the slab
    para(x + 20, y + 14, pw, h - 28, sk * (h - 28) / h); ctx.fillStyle = '#000'; ctx.fill();
    txt(plate, x + 20 + pw / 2 + sk / 2 - 4, y + h / 2 + 6, { size: 110, font: 'B', color: bg });
  }
  txt(s, x + sk / 2 + pw + (w - pw) / 2 + (plate ? 8 : 0), y + h / 2 + 6, { size, color: '#000' });
  if (sub) {
    ctx.fillStyle = 'rgba(0,0,0,0.85)'; ctx.fillRect(W / 2 + dx - sub.length * 11 - 24, y + h + 28, sub.length * 22 + 48, 48);
    txt(sub, W / 2 + dx, y + h + 54, { size: 22 });
  }
}

// ---- player card: join prompt on the title, score on the results ----
function panel(p, x, y, w, h, results) {
  const cx = x + w / 2, on = p.joined;
  if (on) { ctx.strokeStyle = '#fff'; ctx.lineWidth = 4; ctx.strokeRect(x + 12, y + 12, w, h); }
  ctx.fillStyle = '#000'; ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = on ? p.color : C.moss; ctx.lineWidth = on ? 8 : 4; ctx.strokeRect(x, y, w, h);
  const sy = y + 100 + (on ? Math.sin(clock * 3 + p.id) * 6 : 0);
  ctx.globalAlpha = on ? 1 : 0.3;
  if (on) flame(cx - 120, sy, 44 + Math.random() * 44, 2, p.color);
  ctx.save(); ctx.translate(cx, sy); shipArt(p, 2, 0); ctx.restore();
  ctx.globalAlpha = 1;
  txt(`PLAYER ${p.id}`, cx, y + 212, { size: 28, color: on ? p.color : C.dim });
  if (results) { txt(String(Math.floor(p.score)), cx, y + 262, { size: 36 }); return; }
  if (on) { ctx.fillStyle = p.color; ctx.fillRect(x + 28, y + 240, w - 56, 56); txt('READY!', cx, y + 270, { size: 28, color: '#000' }); }
  else {
    txt('PRESS', cx - 152, y + 270, { size: 24, color: (clock * 3 | 0) % 2 ? p.color : '#fff', align: 'left' });
    [...'DEW'].forEach((k, i) => keycap(cx + 14 + i * 58, y + 266, 44, k, SPECIALS[k].color, '#062b0c'));
  }
  txt(`${HINT[p.id]}  ·  PAD X A B`, cx, y + 316, { size: 16, color: C.dim });
}

function drawTitle() {
  ctx.fillStyle = 'rgba(0,0,0,0.62)'; ctx.fillRect(0, 0, W, H);
  confetti();
  if (IMG.logo.naturalWidth) { const lw = 280, lh = lw * IMG.logo.naturalHeight / IMG.logo.naturalWidth; smoothImg(IMG.logo, W / 2 - lw / 2, 84 + Math.sin(clock * 2) * 5, lw, lh); }
  block('DEW SQUADRON', W / 2, 340, 100, C.lime);
  txt('TWO PILOTS. ONE TANK OF DEW. NEVER RUN DRY.', W / 2, 436, { size: 22 });
  panel(players[0], 100, 486, 540, 340); panel(players[1], 1280, 486, 540, 340);
  const by = 640 + Math.sin(clock * 2.2) * 8;     // the shared tank, centre stage
  diamond(W / 2, by, 118, clock * 0.5, C.moss, 6); diamond(W / 2, by, 118, -clock * 0.5 + 0.8, C.lime, 6);
  bottleImg(W / 2, by, 296, 0.2 + Math.sin(clock * 1.3) * 0.05);
  sparkle(W / 2 + 104, by - 112, 24 + 6 * Math.sin(clock * 5)); sparkle(W / 2 - 108, by + 84, 15 + 5 * Math.cos(clock * 4));
  txt('BOTTLES REFILL THE TANK', W / 2, 814, { size: 18, color: C.lime });
  let gx = W / 2 - 352;                           // what the three buttons do
  for (const [k, S] of Object.entries(SPECIALS)) { keycap(gx + 28, 888, 56, k, S.color, '#062b0c'); txt(S.name, gx + 76, 892, { size: 24, align: 'left' }); gx += 146 + S.name.length * 24; }
  if (joinT && !players.every(p => p.joined)) txt(`STARTING IN ${Math.max(0, Math.ceil(6 - (clock - joinT)))}`, W / 2, 966, { size: 22, color: C.lime });
  else if (!AC || AC.state !== 'running') txt('CLICK OR PRESS A KEY FOR SOUND', W / 2, 966, { size: 16, color: C.dim });
  else txt('ENTER = START WITH BOTH PLAYERS', W / 2, 966, { size: 16, color: C.dim });
}

function drawResults() {
  ctx.fillStyle = 'rgba(0,0,0,0.86)'; ctx.fillRect(0, 0, W, H);
  confetti();
  if (victory) block('MISSION COMPLETE', W / 2, 184, 84, C.lime); else block('GAME OVER', W / 2, 184, 110, C.red);
  txt('TEAM SCORE', W / 2, 296, { size: 22, color: C.dim });
  txt(String(Math.floor((players[0].score + players[1].score) * easeOut(stateT / 1.2))), W / 2, 392, { size: 140, font: 'B' });
  const crew = players.filter(p => p.joined), mvp = players[0].score >= players[1].score ? players[0] : players[1];
  crew.forEach((p, i) => {
    const x = crew.length > 1 ? W / 2 + (i ? 30 : -570) : W / 2 - 270;
    panel(p, x, 500, 540, 300, true);
    if (crew.length > 1 && p === mvp) { ctx.fillStyle = C.lime; ctx.fillRect(x + 390, 478, 130, 44); txt('MVP', x + 457, 502, { size: 22, color: '#000' }); sparkle(x + 390, 478, 22); }
  });
  txt(victory ? `ALL ${SECTIONS.length} STAGES CLEARED` : `REACHED STAGE ${secIdx + 1}  ·  ${sec.name}`, W / 2, 868, { size: 20, color: C.dim });
  if (stateT > 3 && (clock * 2 | 0) % 2) txt('PRESS D / E / W', W / 2, 944, { size: 24, color: C.lime });
}

function drawOverlay() {
  if (state === 'title') return drawTitle();
  if (state === 'results') return drawResults();
  if (state === 'play' && bannerT > 0 && bossWarnT <= 0) slab(sec.name, C.lime, `STAGE ${secIdx + 1} OF ${SECTIONS.length}  ·  ${sec.hint}`,
    slideIn(3.2 - bannerT) + (bannerT < 0.3 ? (1 - bannerT / 0.3) ** 3 * 1900 : 0), String(secIdx + 1));
  if (bossWarnT > 0 && (clock * 4 | 0) % 2) slab('WARNING!', C.red, 'THE DROUGHT APPROACHES');
  if (state === 'warp') slab('WARP JUMP!', C.lime, '', slideIn(stateT));
  if (state === 'clear') slab('MISSION COMPLETE!', C.lime, 'THE DROUGHT IS OVER', slideIn(stateT));
  if (state === 'over') slab('GAME OVER', C.red, 'THE SQUADRON RAN DRY', slideIn(stateT));
  if (paused) slab('PAUSED', '#fff');
}

function draw() {
  drawWorld();
  if (state !== 'title' && state !== 'results') drawHud();
  drawOverlay();
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.033, (now - last) / 1000); last = now;
  if (!paused) update(dt);
  tapped.clear();
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
